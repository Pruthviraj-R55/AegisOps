services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisops}
      POSTGRES_USER: ${POSTGRES_USER:-aegisops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisops-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aegisops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aegisops-postgres-data:
