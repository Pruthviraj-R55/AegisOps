[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisops"
version = "0.1.0"
description = "Privacy-first AIOps observability platform scaffolding"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "jsonschema>=4.23,<5",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
collector = ["aiosqlite>=0.20,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.setuptools.packages.find]
include = ["collector*", "saas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
